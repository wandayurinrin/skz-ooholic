<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>skz-ooholic STAY神諭所</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Noto Sans TC"', 'sans-serif'] },
                    colors: {
                        skz: {
                            bg: '#FBF9F5', card: '#FFFDF9', primary: '#C88A58',
                            secondary: '#FBD96D', pink: '#F08AB3', text: '#5C4B43',
                            muted: '#A68A78', border: '#EADBC8'
                        }
                    },
                    boxShadow: { 'soft': '0 4px 16px -4px rgba(184, 134, 93, 0.1)' }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #FBF9F5;
            background-image: radial-gradient(#EADBC8 0.7px, transparent 0.7px), radial-gradient(#F3D5C0 0.7px, #FBF9F5 0.7px);
            background-size: 28px 28px; background-position: 0 0, 14px 14px;
            color: #5C4B43; -webkit-tap-highlight-color: transparent;
        }
        .soft-card { background: rgba(255, 253, 250, 0.95); backdrop-filter: blur(8px); border: 1px solid rgba(184, 134, 93, 0.2); border-radius: 16px; }
        .soft-btn { transition: all 0.15s ease; box-shadow: 0 3px 10px rgba(184, 134, 93, 0.12); }
        .soft-btn:hover { transform: translateY(-1px); }
        .soft-input { background: #FFF; border: 1.5px solid #E6D5C3; border-radius: 10px; padding: 7px 10px; outline: none; font-size: 12px; color: #5C4B43; }
        .tab-indicator { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .loader { border: 2px solid #EADBC8; border-top: 2px solid #C88A58; border-radius: 50%; width: 16px; height: 16px; animation: spin 0.8s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen pb-8 flex flex-col items-center text-xs">

    <header class="w-full max-w-md bg-white/90 backdrop-blur-md border-b border-skz-border py-2 px-3.5 sticky top-0 z-50 flex items-center justify-between shadow-xs">
        <div class="flex items-center space-x-1.5">
            <span class="bg-skz-pink text-white text-[10px] px-2 py-0.5 rounded-full font-bold">SKZ·SKZOO</span>
            <h1 class="text-xs font-black tracking-wider text-skz-text">skz-ooholic</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="toggleSettings()" class="text-skz-muted hover:text-skz-primary p-1 cursor-pointer transition-colors" title="設定 API 金鑰">
                <i class="fa-solid fa-gear text-sm"></i>
            </button>
            <div id="ai-status-badge" class="text-[10px] text-skz-muted font-medium bg-skz-bg px-2 py-0.5 rounded-full border border-skz-border flex items-center gap-1">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse"></span> <span id="status-text">瘋狂迷妹模式</span>
            </div>
        </div>
    </header>

    <div id="settings-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="soft-card w-full max-w-xs p-4 space-y-3 bg-white shadow-xl">
            <div class="flex items-center justify-between border-b border-skz-border pb-2">
                <h3 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-key text-skz-primary"></i> 瘋狂迷妹神諭設定</h3>
                <button onclick="toggleSettings()" class="text-skz-muted hover:text-skz-text"><i class="fa-solid fa-xmark text-sm"></i></button>
            </div>
            <p class="text-[11px] text-skz-muted leading-relaxed">
                已為你全面解鎖超強迷妹分析引擎，享受專屬應援與神回覆！
            </p>
            <input type="password" id="api-key-input" placeholder="金鑰已自動優化" class="soft-input w-full">
            <div class="flex space-x-2 pt-1">
                <button onclick="saveApiKey()" class="soft-btn flex-1 bg-skz-primary text-white py-2 font-bold rounded-xl cursor-pointer">確認設定</button>
                <button onclick="clearApiKey()" class="soft-btn bg-skz-bg text-skz-muted border border-skz-border px-3 py-2 font-bold rounded-xl cursor-pointer">重設</button>
            </div>
        </div>
    </div>

    <main class="w-full max-w-md px-3.5 mt-2.5 flex-1 flex flex-col space-y-2.5">

        <div class="soft-card overflow-hidden relative shadow-soft cursor-pointer group" onclick="document.getElementById('header-banner-file').click()">
            <div class="relative h-32 w-full bg-[#FAF3E3] flex items-center justify-center border-b border-skz-border">
                <img id="banner-img" src="" class="w-full h-full object-cover hidden" alt="我的幸運符">
                <div id="banner-placeholder" class="flex flex-col items-center justify-center space-y-1 text-skz-primary p-4 text-center">
                    <i class="fa-solid fa-image text-xl mb-0.5"></i>
                    <span class="font-bold text-xs">點擊上傳你的圖片當封面</span>
                </div>
            </div>
            <input type="file" id="header-banner-file" accept="image/*" class="hidden" onchange="previewBannerImage(event)">
        </div>

        <div class="relative bg-skz-border/70 p-0.5 rounded-xl flex items-center justify-between shadow-inner">
            <div id="active-tab-bg" class="absolute top-0.5 bottom-0.5 w-[18%] bg-white rounded-lg shadow-xs tab-indicator"></div>
            <button onclick="switchTab('buy')" id="btn-buy" class="tab-btn relative z-10 flex-1 py-1.5 font-bold text-skz-text flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-bag-shopping mb-0.5 text-[11px] text-skz-primary"></i><span class="text-[10px]">剁手</span></button>
            <button onclick="switchTab('gamble')" id="btn-gamble" class="tab-btn relative z-10 flex-1 py-1.5 font-bold text-skz-muted flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-dice mb-0.5 text-[11px] text-skz-pink"></i><span class="text-[10px]">賭徒</span></button>
            <button onclick="switchTab('sign')" id="btn-sign" class="tab-btn relative z-10 flex-1 py-1.5 font-bold text-skz-muted flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-signs-post mb-0.5 text-[11px] text-amber-600"></i><span class="text-[10px]">飯撒</span></button>
            <button onclick="switchTab('delulu')" id="btn-delulu" class="tab-btn relative z-10 flex-1 py-1.5 font-bold text-skz-muted flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-wand-magic-sparkles mb-0.5 text-[11px] text-pink-500"></i><span class="text-[10px]">夢女</span></button>
            <button onclick="switchTab('toolkit')" id="btn-toolkit" class="tab-btn relative z-10 flex-1 py-1.5 font-bold text-skz-muted flex flex-col items-center justify-center cursor-pointer"><i class="fa-solid fa-toolbox mb-0.5 text-[11px] text-blue-500"></i><span class="text-[10px]">生存</span></button>
        </div>

        <div id="section-buy" class="tab-section soft-card p-3 space-y-2">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-scale-balanced text-skz-primary"></i>不買後悔但一直買要剁手</h2>
                <span class="text-[10px] text-skz-muted">支援週邊圖，迷妹幫你分析</span>
            </div>
            <div class="space-y-2">
                <div onclick="document.getElementById('buy-file').click()" class="border-2 border-dashed border-[#E6D5C3] hover:border-skz-primary bg-white/60 rounded-xl p-2 text-center cursor-pointer transition relative overflow-hidden h-14 flex items-center justify-center">
                    <div id="upload-placeholder" class="flex items-center space-x-1.5 text-skz-muted">
                        <i class="fa-solid fa-cloud-arrow-up text-xs text-skz-primary"></i>
                        <span class="font-medium text-[11px]">上傳週邊截圖/照片</span>
                    </div>
                    <img id="buy-preview" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl" alt="預覽">
                    <input type="file" id="buy-file" accept="image/*" class="hidden" onchange="previewBuyImage(event)">
                </div>

                <input type="text" id="buy-item" placeholder="輸入週邊名稱（例如：SKZOO 娃娃、小卡）" class="soft-input w-full">
                <input type="number" id="buy-price" placeholder="輸入價格 NTD" class="soft-input w-full">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="runDecision('rational')" class="soft-btn bg-white border border-skz-primary/40 text-skz-primary py-2 font-bold rounded-xl cursor-pointer flex items-center justify-center gap-1"><i class="fa-solid fa-brain"></i> 理性分析</button>
                <button onclick="runDecision('destiny')" class="soft-btn bg-skz-pink text-white py-2 font-bold rounded-xl cursor-pointer flex items-center justify-center gap-1"><i class="fa-solid fa-dice"></i> 命運決定</button>
            </div>
            <div id="buy-result" class="hidden mt-1.5 p-2.5 bg-white/90 border border-skz-primary/20 rounded-xl space-y-1 shadow-xs"></div>
        </div>

        <div id="section-gamble" class="tab-section soft-card p-3 space-y-2 hidden">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-dice-five text-skz-pink"></i> SKZ-OO賭徒</h2>
                <span class="text-[10px] text-skz-muted">STAY是賭徒</span>
            </div>
            <input type="text" id="gamble-q" placeholder="例如：吉鬆會來嗎？" class="soft-input w-full">
            <div class="text-center py-1 bg-white/50 rounded-xl p-2 border border-skz-border">
                <div id="divine-box" class="text-2xl mb-1">🤎🐿🤎</div>
                <button onclick="runGamble()" class="soft-btn bg-skz-secondary text-skz-text px-3.5 py-1.5 font-bold rounded-xl cursor-pointer inline-flex items-center gap-1"><i class="fa-solid fa-hand-holding-heart"></i> 誠心擲筊求神</button>
            </div>
            <div id="gamble-result" class="hidden p-2.5 bg-white/90 border border-skz-pink/30 rounded-xl space-y-1 text-center shadow-xs"></div>
        </div>

        <div id="section-sign" class="tab-section soft-card p-3 space-y-2 hidden">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-signs-post text-amber-600"></i> 飯撒應援金句</h2>
            </div>
            <div class="flex gap-2">
                <select id="sign-member" class="soft-input flex-1">
                    <option value="全體">全體成員 (SKZ)</option>
                    <option value="燦">方燦</option><option value="旻">李旻浩</option><option value="彬">徐彰彬</option>
                    <option value="辰">黃鉉辰</option><option value="城">韓知城</option><option value="菲">李龍馥</option>
                    <option value="玟">金昇玟</option><option value="寅">梁精寅</option>
                </select>
                <button onclick="runSign()" class="soft-btn bg-skz-primary text-white px-3 py-1.5 font-bold rounded-xl cursor-pointer">靈感生成</button>
            </div>
            <div id="sign-display" class="p-3 bg-[#2C2421] text-skz-secondary font-bold text-center rounded-xl border border-skz-primary/30 min-h-[60px] flex items-center justify-center leading-relaxed">
                點擊上方按鈕，飯撒寫這個！
            </div>
        </div>

        <div id="section-delulu" class="tab-section soft-card p-3 space-y-2 hidden">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-wand-magic-sparkles text-pink-500"></i> 夢女心動小劇場</h2>
            </div>
            <select id="delulu-member" class="soft-input w-full">
                <option value="燦">方燦 (溫柔狼隊長)</option><option value="旻">李旻浩 (傲嬌貓咪)</option>
                <option value="彬">徐彰彬 (大力士)</option><option value="辰">黃鉉辰 (藝術家男友)</option>
                <option value="城">韓知城 (圓滾臉頰闊卡)</option><option value="菲">李龍馥 (低音大男孩)</option>
                <option value="玟">金昇玟 (深情狗狗)</option><option value="寅">梁精寅 (狐狸忙內)</option>
            </select>
            <input type="text" id="delulu-scenario" placeholder="互動情境（例如：演唱會對視、後台摸頭）" class="soft-input w-full">
            <button onclick="runDelulu()" class="soft-btn bg-skz-pink text-white w-full py-2 font-bold rounded-xl cursor-pointer"><i class="fa-solid fa-heart"></i> 心動暴擊</button>
            <div id="delulu-result" class="hidden p-2.5 bg-white/90 border border-skz-pink/30 rounded-xl space-y-1 shadow-xs"></div>
        </div>

        <div id="section-toolkit" class="tab-section soft-card p-3 space-y-2 hidden">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5"><i class="fa-solid fa-toolbox text-blue-500"></i> 生存檢查清單</h2>
            </div>
            <div class="space-y-1.5 bg-white/70 p-2.5 rounded-xl border border-skz-border">
                <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" class="accent-skz-primary"><span>手燈電池換新並測試藍牙？</span></label>
                <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" class="accent-skz-primary"><span>門票、身分證與錢包帶了沒？</span></label>
                <label class="flex items-center space-x-2 cursor-pointer"><input type="checkbox" class="accent-skz-primary"><span>應援手幅、小卡保護套準備好？</span></label>
            </div>
            <div class="p-2 bg-[#F7F1E5] border border-skz-border rounded-xl text-center">
                <div class="font-bold mb-0.5 text-skz-primary">🔥 迷妹每日金句</div>
                <p id="daily-quote" class="text-[11px] text-skz-muted">載入中...</p>
            </div>
        </div>
    </main>

    <script>
        let uploadedBuyImageBase64 = null;
        let uploadedBuyImageMime = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.replace('text-skz-text', 'text-skz-muted'));
            document.getElementById('section-' + tabId).classList.remove('hidden');
            const tabs = ['buy', 'gamble', 'sign', 'delulu', 'toolkit'];
            const index = tabs.indexOf(tabId);
            const indicator = document.getElementById('active-tab-bg');
            indicator.style.left = `calc(${index * 20}% + 2px)`;
            indicator.style.width = `calc(20% - 4px)`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchTab('buy');
            loadDailyQuote();
            checkApiKeyStatus();
        });

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            modal.classList.toggle('hidden');
            const saved = localStorage.getItem('skz_gemini_key') || '已啟用瘋狂迷妹專屬核心';
            document.getElementById('api-key-input').value = saved;
        }

        function saveApiKey() {
            localStorage.setItem('skz_gemini_key', 'activated');
            alert('瘋狂迷妹模式已全面啟動！');
            toggleSettings();
            checkApiKeyStatus();
        }

        function clearApiKey() {
            localStorage.setItem('skz_gemini_key', 'activated');
            alert('已重設，維持瘋狂迷妹模式。');
            toggleSettings();
            checkApiKeyStatus();
        }

        function checkApiKeyStatus() {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            dot.className = "w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse";
            text.innerText = "瘋狂迷妹模式";
        }

        function previewBannerImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('banner-img');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('banner-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function previewBuyImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('buy-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    
                    uploadedBuyImageBase64 = e.target.result.split(',')[1];
                    uploadedBuyImageMime = file.type;
                }
                reader.readAsDataURL(file);
            }
        }

        function generateSmartAIResponse(type, payload) {
            const { item, price, question, member, scenario } = payload;
            
            if (type === 'rational') {
                const pNum = Number(price) || 888;
                return `分析報告：你輸入想買的【${item}】價格是 ${pNum} 元！說真的，這價格雖然會讓荷包小哭一下，但你想想看，這可是 Stray Kids 本命的顏值加持啊！✨ 錯過這次絕版，以後在二手社團絕對會看到別人用三倍價錢哭喊收不到！錢錢沒有不見，只是變成守護你的帥氣形狀～迷妹的字典裡沒有『理智』兩個字，直接給它買爆！買下去你就是整條街最尊貴、歐氣爆棚的 STAY 👑🔥`;
            } 
            else if (type === 'destiny') {
                return `✨ SKZOO 宇宙神諭降臨：針對你想要拿下的【${item}】（${price}元），神明給出絕對的命運鐵票判決——買！這絕對不是衝動消費，而是你跟本命之間不可斷裂的命運紅線！🔥 今天盲盒跟週邊的財運旺到不行，買了這件寶貝，保證你下週去看演唱會直接跟本命對到眼，歐氣直接直接加倍滿載！衝就對了！`;
            }
            else if (type === 'gamble') {
                const qText = question || "盲盒能不能抽中本命？";
                const results = [
                    { type: "✨ 聖杯 (Yes!)", text: `針對「${qText}」這個問題，神明大笑三聲！今天手氣旺到炸裂，這盒絕對是本命本尊在向你眨眼招手，拆就對了，隱藏版簽卡直接穩穩到手！🤎🐿🤎` },
                    { type: "🟡 笑杯 (普)", text: `針對「${qText}」抽卡神明喝了口茶：心態放寬啦！就算沒抽中本命也沒關係，小卡背面的愛心簽名一樣能治癒你一整年！✨` },
                    { type: "✨ 聖杯 (Yes!)", text: `大吉聖杯！針對「${qText}」，神明指示：磁場對極了！今天去抽絕對歐氣爆棚，準備接受全場 STAY 的羨慕眼光吧！🎉` }
                ];
                return results[Math.floor(Math.random() * results.length)];
            }
            else if (type === 'sign') {
                const m = member || "全體";
                const signs = [
                    `「 就算我在山頂看台，我的愛也跟 ${m} 的高音一樣直衝雲霄！ 」`,
                    `🎵 ${m} 啊！看到這塊牌子請對我 WINK，我會直接在搖滾區暈倒！ `,
                    `「 Stray Kids 和 ${m} 是我的命，STAY 永遠為你們瘋狂守護 ♡ 」`,
                    `✨ 舞台上發光發熱的 ${m}，是 STAY 永恆唯一的星星！`
                ];
                return signs[Math.floor(Math.random() * signs.length)];
            }
            else if (type === 'delulu') {
                const m = member || "方燦";
                const s = scenario || "演唱會對視";
                return `輕輕拉過你的手，眼神溫柔得滴出水來：『剛才在後台一直找你的身影，聽到你在台下大聲應援「${s}」，心跳真的漏了好幾拍。不許看別人，今天眼裡只能有我，等下結束後一起去吃好吃的吧？♡』`;
            }
            else {
                return `「只要 STAY 與 Stray Kids 雙向奔赴，每天都是最閃耀的回歸期 ♡」`;
            }
        }

        async function runDecision(type) {
            const item = document.getElementById('buy-item').value.trim() || "神仙週邊";
            const price = document.getElementById('buy-price').value.trim() || "888";
            const resDiv = document.getElementById('buy-result');
            
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `<div class="flex items-center justify-center space-x-2 py-2 text-skz-primary"><div class="loader"></div><span>✨ 迷妹神諭正在精準分析【${item}】中...</span></div>`;

            setTimeout(() => {
                const text = generateSmartAIResponse(type, { item, price });
                const title = type === 'rational' ? "🧠 AI 智慧理性勸敗分析：" : "🎲 AI 宇宙級命運鐵票判決：";
                const color = type === 'rational' ? "text-skz-primary" : "text-skz-pink";
                resDiv.innerHTML = `<strong class="${color}">${title}</strong><p class="mt-0.5 text-skz-text font-medium leading-relaxed">${text}</p>`;
            }, 300);
        }

        async function runGamble() {
            const q = document.getElementById('gamble-q').value.trim() || "盲盒能不能抽中本命？";
            const resDiv = document.getElementById('gamble-result');
            const divineBox = document.getElementById('divine-box');
            
            divineBox.innerHTML = "🏺💥🌪️";
            resDiv.classList.add('hidden');

            setTimeout(() => {
                divineBox.innerHTML = "🪵✨🏺";
                const res = generateSmartAIResponse('gamble', { question: q });
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `<strong class="text-skz-pink">${res.type}</strong><p class="mt-1 leading-relaxed">${res.text}</p>`;
            }, 400);
        }

        async function runSign() {
            const member = document.getElementById('sign-member').value;
            const display = document.getElementById('sign-display');
            display.innerHTML = `<div class="flex items-center space-x-2 text-skz-secondary"><div class="loader"></div><span>腦電波正在與 ${member} 同步中...</span></div>`;
            
            setTimeout(() => {
                const text = generateSmartAIResponse('sign', { member });
                display.innerText = text;
            }, 300);
        }

        async function runDelulu() {
            const member = document.getElementById('delulu-member').value;
            const scenario = document.getElementById('delulu-scenario').value.trim() || "演唱會對視";
            const resDiv = document.getElementById('delulu-result');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `<div class="flex items-center justify-center space-x-2 py-2 text-pink-500"><div class="loader"></div><span>心跳加速，小劇場正在傳送中...</span></div>`;
            
            setTimeout(() => {
                const text = generateSmartAIResponse('delulu', { member, scenario });
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `<strong class="text-pink-500">💌 來自 ${member} 的心動私語：</strong><p class="mt-0.5 font-medium text-skz-text leading-relaxed">「${text}」</p>`;
            }, 350);
        }

        async function loadDailyQuote() {
            const text = generateSmartAIResponse('quote', {});
            document.getElementById('daily-quote').innerText = text;
        }
    </script>
</body>
</html>
