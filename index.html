，            </div>

            <button onclick="callGeminiDelulu()" class="soft-btn bg-skz-pink text-white w-full py-2 font-bold rounded-xl cursor-pointer shadow-xs">

            <div id="delulu-result" class="hidden p-2.5 bg-white/90 border border-skz-pink/30 rounded-xl space-y-1 shadow-xs"></div>

        <!-- 5. Survival Toolkit & Daily Quote -->
        <div id="section-toolkit" class="tab-section soft-card p-3 space-y-2 hidden">
            <div class="flex items-center justify-between border-b border-skz-border pb-1">
                <h2 class="font-bold text-skz-text flex items-center gap-1.5">

                </h2>
                <span class="text-[10px] text-skz-muted">出門自我檢核</span>

            <div class="space-y-1.5 bg-white/70 p-2.5 rounded-xl border border-skz-border">
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" class="w-3.5 h-3.5 accent-skz-primary">

                <label class="flex items-center space-x-2 cursor-pointer">

                <label class="flex items-center space-x-2 cursor-pointer">

            <div class="p-2 bg-[#F7F1E5] border border-skz-border rounded-xl text-center">

                <p id="daily-quote" class="text-[11px] text-skz-muted">載入中...</p>

    </main>

    <footer class="w-full text-center mt-3 text-[10px] text-skz-muted">
        <p>skz-ooholic v3.3 ♡ Real-time AI for Stay</p>

    <script>
        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.replace('text-skz-text', 'text-skz-muted'));
            
            document.getElementById('section-' + tabId).classList.remove('hidden');
            
            const tabs = ['buy', 'gamble', 'sign', 'delulu', 'toolkit'];
            const index = tabs.indexOf(tabId);
            const indicator = document.getElementById('active-tab-bg');
            indicator.style.left = `calc(${index * 20}% + 2px)`;
            indicator.style.width = `calc(20% - 4px)`;
        }

        window.addEventListener('DOMContentLoaded', () => {
            switchTab('buy');
            loadDailyQuote();
        });

        // Banner Image Uploader for User's Custom Crayon Art
        function previewBannerImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const bannerImg = document.getElementById('banner-img');
                    bannerImg.src = e.target.result;
                    bannerImg.classList.add('block');
                    bannerImg.classList.remove('hidden');
                    document.getElementById('banner-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function previewBuyImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('buy-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // Robust Gemini API Call using user's key and header authentication
        async function callGemini(systemPrompt, userPrompt, fallbackType = 'buy', retries = 3, delay = 1000) {
            const apiKey = "AQ.Ab8RN6Jf1hhqA-aBqHYf2DYtNO8h8qLtmOe0pox2_3wAhjzR5A";
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent`;
            const payload = {
                contents: [{ parts: [{ text: userPrompt }] }],
                systemInstruction: { parts: [{ text: systemPrompt }] }
            };

            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(apiUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-goog-api-key': apiKey
                        },
                        body: JSON.stringify(payload)
                    });
                    if (!response.ok) throw new Error('Network error');
                    const result = await response.json();
                    const candidate = result.candidates?.[0];
                    if (candidate && candidate.content?.parts?.[0]?.text) {
                        return candidate.content.parts[0].text;
                    }
                    throw new Error('Invalid structure');
                } catch (error) {
                    if (i === retries - 1) {
                        return getSmartFallback(fallbackType);
                    }
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                }
            }
        }

        function getSmartFallback(type) {
            if (type === 'buyRational') {
                return "這件週邊的精緻度跟本命的直拍一樣無懈可擊！錢錢沒有不見，只是變成你快樂的形狀，買！";
            } else if (type === 'buyDestiny') {
                return "✨ 命運骰子顯示：買爆！連 SKZOO 都在對你眨眼，不買對不起自己！";
            } else if (type === 'gamble') {
                return "✨ 聖杯 (Yes!)：神明大笑！今天手氣旺到不行，這盒絕對是本命本尊！";
            } else if (type === 'sign') {
                return "「 Stay永遠是Stray Kids最強的後盾 ♡ 」";
            } else if (type === 'delulu') {
                return "「（輕輕摸頭）今天練習雖然累，但看到台下的你，就覺得一切都值得了。」";
            } else {
                return "「只要 Stay 與 Stray Kids 心意相連，世界巡演就在我們身邊。」";
            }
        }

        // 1. Buy Decision Maker
        async function callGeminiBuy(isRational) {
            const item = document.getElementById('buy-item').value.trim() || "神仙週邊";
            const price = document.getElementById('buy-price').value.trim() || "888";
            const resDiv = document.getElementById('buy-result');
            
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `<div class="flex items-center justify-center space-x-2 py-2 text-skz-primary"><div class="loader"></div><span>✨ 神諭正在解析中...</span></div>`;

            const systemPrompt = isRational 
                ? "你是一個幽默、懂追星梗的迷妹財務顧問。請用繁體中文給出犀利且幽默的理性分析，語氣輕鬆可愛，字數在 80 字以內。"
                : "你是一個神準的迷妹命運之神。請用繁體中文給出直覺且充滿綜藝感的判決，語氣可愛，字數在 60 字以內。";

            const userPrompt = `我想買 "${item}"，價格是 ${price} 台幣。請給我建議。`;
            const text = await callGemini(systemPrompt, userPrompt, isRational ? 'buyRational' : 'buyDestiny');
            
            const title = isRational ? "🧠 理性分析：" : "🎲 命運指引：";
            const color = isRational ? "text-skz-primary" : "text-skz-pink";
            resDiv.innerHTML = `<strong class="${color}">${title}</strong><p class="mt-0.5 text-skz-text font-medium">${text}</p>`;
        }

        // 2. Gambler Oracle
        async function callGeminiGamble() {
            const q = document.getElementById('gamble-q').value.trim() || "盲盒能不能抽中本命？";
            const resDiv = document.getElementById('gamble-result');
            const divineBox = document.getElementById('divine-box');
            
            divineBox.innerHTML = "🏺💥🌪️";
            resDiv.classList.add('hidden');

            const systemPrompt = "你是一個迷妹盲盒抽卡神明。請用繁體中文給出擲筊結果（聖杯、笑杯或陰杯），並附帶搞笑、貼切且帶有飯圈梗的解讀，總字數 80 字以內。";
            const userPrompt = `我的問題是：${q}`;

            const text = await callGemini(systemPrompt, userPrompt, 'gamble');
            setTimeout(() => {
                divineBox.innerHTML = "🪵✨🏺";
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `<p class="mt-0.5 text-skz-text font-medium leading-relaxed">${text}</p>`;
            }, 400);
        }

        // 3. Fan Sign Generator
        async function callGeminiSign() {
            const member = document.getElementById('sign-member').value;
            const display = document.getElementById('sign-display');
            
            display.innerHTML = `<div class="flex items-center space-x-2 text-skz-secondary"><div class="loader"></div><span>靈感接收中...</span></div>`;

            const systemPrompt = "你是一個演唱會應援牌專家。請根據使用者指定的成員，用繁體中文生成一句適合寫在應援牌上、創意十足、幽默且能讓偶像一眼看到的金句。只輸出金句內容本身（加上引號）。";
            const userPrompt = `指定成員：${member}`;

            const text = await callGemini(systemPrompt, userPrompt, 'sign');
            display.innerText = text;
        }

        // 4. Delulu Generator
        async function callGeminiDelulu() {
            const member = document.getElementById('delulu-member').value;
            const scenario = document.getElementById('delulu-scenario').value.trim() || "日常寵溺";
            const resDiv = document.getElementById('delulu-result');
            
            resDiv.classList.add('hidden');
            resDiv.innerHTML = `<div class="flex items-center justify-center space-x-2 py-2 text-pink-500"><div class="loader"></div><span>心跳加速中...</span></div>`;

            const systemPrompt = "你是一個溫柔寵粉的 Stray Kids 成員。請根據指定的成員與情境，用繁體中文寫出一句讓人心動、充滿粉紅泡泡的寵溺情話，字數 80 字以內。";
            const userPrompt = `成員：${member}，情境：${scenario}`;

            const text = await callGemini(systemPrompt, userPrompt, 'delulu');
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = `<strong class="text-pink-500">💌 來自 ${member} 的心動私語：</strong><p class="mt-0.5 font-medium text-skz-text">${text}</p>`;
        }

        // 5. Daily Quote Loader
        async function loadDailyQuote() {
            const quoteEl = document.getElementById('daily-quote');
            const text = await callGemini("你是一個充滿熱情的 Stay。請用繁體中文寫一句溫馨且充滿追星正能量的金句，字數 40 字以內，加上引號。", "生成今日迷妹金句", 'quote');
            quoteEl.innerText = text;
        }
    </script>
