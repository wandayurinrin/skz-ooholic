​<script>
function switchTab(tabId) {
document.querySelectorAll('.tab-section').forEach(el => el.classList.add('hidden'));
document.querySelectorAll('.tab-btn').forEach(el => el.classList.replace('text-skz-text', 'text-skz-muted'));
document.getElementById('section-' + tabId).classList.remove('hidden');
const tabs = ['buy', 'gamble', 'sign', 'delulu', 'toolkit'];
const index = tabs.indexOf(tabId);
const indicator = document.getElementById('active-tab-bg');
indicator.style.left = calc(${index * 20}% + 2px);
indicator.style.width = calc(20% - 4px);
}
​window.addEventListener('DOMContentLoaded', () => {
switchTab('buy');
loadDailyQuote();
checkApiKeyStatus();
});
​function toggleSettings() {
const modal = document.getElementById('settings-modal');
modal.classList.toggle('hidden');
const saved = localStorage.getItem('skz_gemini_key') || '';
document.getElementById('api-key-input').value = saved;
}
​function saveApiKey() {
const key = document.getElementById('api-key-input').value.trim();
if (key) {
localStorage.setItem('skz_gemini_key', key);
alert('API 金鑰已成功儲存！');
toggleSettings();
checkApiKeyStatus();
} else {
alert('請輸入有效的金鑰！');
}
}
​function clearApiKey() {
localStorage.removeItem('skz_gemini_key');
document.getElementById('api-key-input').value = '';
alert('已清除 API 金鑰，將恢復一般迷妹模式。');
toggleSettings();
checkApiKeyStatus();
}
​function checkApiKeyStatus() {
const key = localStorage.getItem('skz_gemini_key');
const dot = document.getElementById('status-dot');
const text = document.getElementById('status-text');
if (key && key.startsWith('AQ')) {
dot.className = "w-2 h-2 rounded-full bg-green-500 inline-block animate-pulse";
text.innerText = "Gemini線上";
} else {
dot.className = "w-2 h-2 rounded-full bg-amber-500 inline-block";
text.innerText = "一般迷妹模式";
}
}
​function previewBannerImage(event) {
const file = event.target.files[0];
if (file) {
const reader = new FileReader();
reader.onload = function(e) {
const img = document.getElementById('banner-img');
img.src = e.target.result;
img.classList.remove('hidden');
document.getElementById('banner-placeholder').classList.add('hidden');
};
reader.readAsDataURL(file);
}
}

​async function callAIOrFallback(systemPrompt, userPrompt, category) {
const apiKey = localStorage.getItem('skz_gemini_key') || "";
​if (apiKey && apiKey.startsWith('AQ')) {
// 🌟 使用正確的 AQ 格式網址參數傳遞方式
const apiUrl = https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey};
​try {
const response = await fetch(apiUrl, {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({
contents: [{ parts: [{ text: userPrompt +  (隨機戳記:${Math.random()}) }] }],
systemInstruction: { parts: [{ text: systemPrompt }] },
generationConfig: { temperature: 1.3, maxOutputTokens: 100 }
})
});
​if (!response.ok) {
const errText = await response.text();
console.error("Gemini API Error:", errText);
throw new Error('API 回應錯誤');
}
​const result = await response.json();
const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
​if (text) {
return text;
}
} catch (err) {
console.warn("線上 AI 呼叫受阻，自動切換至內建模式:", err);
}
}
​// Fallback to rich database seamlessly if no key or error
const pool = massiveDB[category] || massiveDB.quotes;
const item = pool[Math.floor(Math.random() * pool.length)];
if (category === 'gamble') return <strong class="text-skz-pink">${item.type}</strong><p class="mt-1">${item.text}</p>;
return item;
}
