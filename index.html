            const tabs = ['buy', 'gamble', 'sign', 'delulu', 'toolkit'];
            const index = tabs.indexOf(tabId);
            const indicator = document.getElementById('active-tab-bg');
            indicator.style.left = 'calc(' + (index * 20) + '% + 4px)';
            indicator.style.width = 'calc(20% - 8px)';
        }

        window.addEventListener('DOMContentLoaded', function() {
            switchTab('buy');
            loadDailyQuote();
            checkConnectionStatus(false);
        });

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                setTimeout(() => modal.classList.add('opacity-100'), 10);
            } else {
                modal.classList.remove('opacity-100');
                setTimeout(() => modal.classList.add('hidden'), 200);
            }
        }

        async function checkConnectionStatus(showAlert = false) {
            const dot = document.getElementById('status-dot');
            const text = document.getElementById('status-text');
            const desc = document.getElementById('modal-status-desc');
            
            if (showAlert) {
                desc.innerHTML = "✨ 正在點燃迷妹腦波...";
            }

            const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_VERSION}:generateContent`;
            const payload = { contents: [{ parts: [{ text: "ping" }] }] };
            let success = false;
            let errorMessage = "";

            try {
                // 策略 1: 標準 ?key= 參數 (最穩定)
                let response = await fetch(`${url}?key=${MY_GEMINI_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                }).catch(() => null);

                // 策略 2: Bearer Token 驗證 (針對特定 AQ 金鑰)
                if (!response || !response.ok) {
                    response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MY_GEMINI_KEY}` },
                        body: JSON.stringify(payload)
                    }).catch(() => null);
                }

                // 策略 3: x-goog-api-key 標頭
                if (!response || !response.ok) {
                    response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': MY_GEMINI_KEY },
                        body: JSON.stringify(payload)
                    }).catch(() => null);
                }

                if (response && response.ok) {
                    success = true;
                } else if (response) {
                    const data = await response.json();
                    errorMessage = data.error?.message || "未知的 Google API 拒絕存取錯誤";
                } else {
                    errorMessage = "網路斷線或被瀏覽器阻擋 (CORS)";
                }

                if (success) {
                    isCrazyMode = true;
                    dot.className = "w-2.5 h-2.5 rounded-full bg-green-500 inline-block animate-pulse shadow-[0_0_8px_rgba(34,197,94,0.8)]";
                    text.innerText = "瘋狂迷妹模式";
                    text.className = "text-[11px] text-green-600 font-black";
                    desc.innerHTML = "✨ 瘋狂迷妹已上線！！";
                    if (showAlert) { alert('✨ 成功重新已進入瘋狂迷妹模式 ♡'); toggleSettings(); }
                } else {
                    throw new Error(errorMessage);
                }
            } catch (err) {
                isCrazyMode = false;
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-500 inline-block shadow-sm";
                text.innerText = "一般迷妹模式";
                text.className = "text-[11px] text-skz-muted font-bold";
                desc.innerHTML = "💛 瘋狂迷妹出走了，切換為一般迷妹模式";
                if (showAlert) { alert('💛 瘋狂迷妹似乎登出了，已呼叫一般迷妹！'); toggleSettings(); }
            }
        }

        function previewBannerImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById('banner-img');
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                    document.getElementById('banner-placeholder').classList.add('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        function previewBuyImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('buy-preview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                    
                    uploadedBuyImageBase64 = e.target.result.split(',')[1];
                    uploadedBuyImageMime = file.type;
                };
                reader.readAsDataURL(file);
            }
        }

        async function callOracleEngine(systemPrompt, userPrompt, category, hasImage = false) {
            
            // 強制加上這個極其嚴格的後綴，確保它不會敷衍，且絕對不用 AI 語氣
            const strictRules = `
            【絕對指令：你是一個為Stray Kids發瘋的極致資深STAY迷妹！嚴禁在回覆中出現「AI、語言模型、系統、機器人」等任何出戲字眼。
            回答必須極度熱情、生動、字數必須超過 150 字！請瘋狂使用飯圈用語(如：本命、歐氣、回歸、直拍、買爆、暈船)與海量顏文字(如：🥺, 🔥, ✨, 🤎)。
            請完全沉浸在瘋狂迷妹的角色裡，不要給出任何死板的清單，要像跟閨蜜瘋狂聊天一樣！】`;

            let parts = [{ text: userPrompt }];
            if (hasImage && uploadedBuyImageBase64 && uploadedBuyImageMime) {
                parts.push({
                    inlineData: { mimeType: uploadedBuyImageMime, data: uploadedBuyImageBase64 }
                });
            }

            if (isCrazyMode) {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL_VERSION}:generateContent`;
                const payload = {
                    contents: [{ role: "user", parts: parts }],
                    systemInstruction: { parts: [{ text: systemPrompt + strictRules }] },
                    generationConfig: { temperature: 0.9, maxOutputTokens: 600 }
                };

                try {
                    // 同樣採用三引擎保證發送
                    let response = await fetch(`${url}?key=${MY_GEMINI_KEY}`, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                    }).catch(() => null);

                    if (!response || !response.ok) {
                        response = await fetch(url, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${MY_GEMINI_KEY}` }, body: JSON.stringify(payload)
                        }).catch(() => null);
                    }

                    if (!response || !response.ok) {
                        response = await fetch(url, {
                            method: 'POST', headers: { 'Content-Type': 'application/json', 'x-goog-api-key': MY_GEMINI_KEY }, body: JSON.stringify(payload)
                        }).catch(() => null);
                    }

                    if (response && response.ok) {
                        const result = await response.json();
                        const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (text) return text.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>'); // 自動換行處理
                    }
                } catch (err) {
                    console.warn('API 呼叫失敗，降級使用內建長篇圖書館...', err);
                }
            }

            // 如果離線或連線失敗，直接啟用內建的長篇回覆
            const pool = massiveDB[category] || massiveDB.quotes;
            const item = pool[Math.floor(Math.random() * pool.length)];
            if (category === 'gamble') return `<strong class="text-skz-pink text-sm block mb-1.5">${item.type}</strong><span class="leading-relaxed">${item.text}</span>`;
            const textResult = typeof item === 'string' ? item : item.text;
            return textResult.replace(/\n\n/g, '<br><br>').replace(/\n/g, '<br>');
        }

        async function runDecision(type) {
            const item = document.getElementById('buy-item').value.trim() || "夢幻神仙週邊";
            const price = document.getElementById('buy-price').value.trim() || "999";
            const resDiv = document.getElementById('buy-result');
            
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = '<div class="flex items-center justify-center space-x-2.5 py-4 text-skz-primary"><div class="loader"></div><span class="font-bold tracking-wider">🔥 瘋狂迷妹腦波正在極速燃燒分析中...</span></div>';

            const sysPrompt = type === 'rational' 
                ? "請針對使用者想買的週邊給出『表面看似理性、實際上是瘋狂推坑勸敗』的深度長篇分析。"
                : "請針對使用者想買的週邊，給出充滿綜藝感、極度浮誇且命中註定必須買的『宇宙鐵票判決』。";

            const text = await callOracleEngine(sysPrompt, `姐妹幫我看！我想買的週邊是：${item}，價格是：${price} 台幣。快推坑我！`, type, true);
            
            const title = type === 'rational' ? "🧠 神明理性勸敗指引：" : "🎲 宇宙級命運鐵票判決：";
            const color = type === 'rational' ? "text-skz-primary" : "text-skz-pink";
            resDiv.innerHTML = `<strong class="${color} block mb-2 text-sm">${title}</strong><div class="mt-1 text-skz-text font-medium leading-relaxed">${text}</div>`;
        }

        async function runGamble() {
            const q = document.getElementById('gamble-q').value.trim() || "這盒盲盒抽下去會有我的大本命嗎？";
            const resDiv = document.getElementById('gamble-result');
            const divineBox = document.getElementById('divine-box');
            
            divineBox.innerHTML = "🏺💥🌪️";
            resDiv.classList.add('hidden');

            const sysPrompt = "你是一個調皮的抽卡神明。請直接針對信徒的求籤內容給出【聖杯】、【笑杯】或【陰杯】的明確結果，並附上超級搞笑、戲劇化、充滿飯圈梗的長篇深度解讀。";
            const rawText = await callOracleEngine(sysPrompt, `神明啊請告訴我：${q}`, 'gamble');

            setTimeout(function() {
                divineBox.innerHTML = "🪵✨🏺";
                resDiv.classList.remove('hidden');
                resDiv.innerHTML = `<div class="leading-relaxed">${rawText}</div>`;

        async function runSign() {

            const display = document.getElementById('sign-display');
            display.innerHTML = '<div class="flex items-center space-x-2 text-skz-secondary w-full justify-center"><div class="loader"></div><span class="font-bold tracking-wider">✨ 腦電波與寶貝強力同步中...</span></div>';
            
            const sysPrompt = "請想出2到3句讓該成員在台上看到絕對會笑出來、超級吸睛、充滿反差萌梗的繁體中文應援金句。並用迷妹激動的語氣附上為什麼這句會中！";
            const text = await callOracleEngine(sysPrompt, `幫我想給「${member}」的超強演唱會應援手幅金句！`, 'signs');
            display.innerHTML = `<div class="text-left w-full">${text}</div>`;

        async function runDelulu() {
            const member = document.getElementById('delulu-member').value;
            const scenario = document.getElementById('delulu-scenario').value.trim() || "演唱會彩排對視";
            const resDiv = document.getElementById('delulu-result');
            
            resDiv.classList.remove('hidden');
            resDiv.innerHTML = '<div class="flex items-center justify-center space-x-2.5 py-4 text-pink-500"><div class="loader" style="border-top-color:#F08AB3;"></div><span class="font-bold tracking-wider">💌 心跳加速，專屬小劇場極速傳送中...</span></div>';
            
            const sysPrompt = "你現在是Stray Kids的指定成員本人。請根據互動情境，對STAY說一段心跳漏拍、極度寵溺的長篇情話。必須包含極其具體的動作描寫，畫面感十足，讓人瞬間暈船！";
            const text = await callOracleEngine(sysPrompt, `我是成員：${member}，我們現在的情境是：${scenario}。請對我說情話。`, 'delulu');
            
            resDiv.innerHTML = `<strong class="text-pink-500 block mb-2 text-sm">來自 ${member} 的專屬心動私語：</strong><div class="mt-1 font-medium text-skz-text italic leading-relaxed">「${text}」</div>`;
        }

        async function loadDailyQuote() {
            document.getElementById('daily-quote').innerHTML = await callOracleEngine("請產出一句熱血、感動、充滿追星正能量與飯圈用語的超長篇每日金句，激勵今天的STAY自己。", "給我一句STAY專屬的長篇每日金句", 'quotes');
        }
    </script>
